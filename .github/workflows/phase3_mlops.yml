name: Phase 3 MLOps Pipeline (NLP + Prophet + MLflow/HF)

on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

jobs:
  run-mlops-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      MLFLOW_TRACKING_URI: https://dagshub.com/lm7345135-ctrl/c109-youtube-analytics.mlflow
      MLFLOW_TRACKING_USERNAME: lm7345135-ctrl
      MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_REPO_ID: NadaKasa/c109-youtube-analytics-artifacts

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install CPU PyTorch and MLOps dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install \
            sentence-transformers \
            umap-learn \
            hdbscan \
            optuna \
            scikit-learn \
            sudachipy \
            sudachidict_core \
            hydra-core \
            omegaconf \
            prophet \
            pyarrow \
            pandas \
            mlflow-skinny \
            huggingface_hub

      - name: Run Phase 3-1a (NLP Clustering & Optuna)
        run: |
          python mlops/nlp/run_clustering_pipeline.py

      - name: Run Phase 3-1b (Prophet Forecast)
        run: |
          python mlops/nlp/run_prophet_forecast.py

      - name: Run Phase 3-2 (Log to DagsHub MLflow & Upload to HF Hub)
        run: |
          python mlops/nlp/log_experiment.py
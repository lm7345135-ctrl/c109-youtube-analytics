name: Step2 DWH & Feature Store Pipeline

on:
  schedule:
    # 毎日 04:00 JST (19:00 UTC) に実行（Step1 収集バッチの後段）
    - cron: '0 19 * * *'
  workflow_dispatch:

jobs:
  run-step2-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install dbt-bigquery google-cloud-bigquery google-cloud-firestore dagster dvc dvc-gs pandas pyarrow

      - name: Authenticate to GCP (Step2 Least-Privilege SA)
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_STEP2_SA_KEY }}

      - name: Materialize all Step2 Assets via Dagster
        run: |
         python orchestration/dagster_assets.py

      